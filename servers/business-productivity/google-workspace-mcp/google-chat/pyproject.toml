[project]
name = "google-chat-mcp"
version = "0.1.0"
description = "Google Chat MCP Server for bot integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client"
]

[project.scripts]
google-chat-mcp = "server:main"
