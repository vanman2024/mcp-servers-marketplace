[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-http-mcp"
version = "0.1.0"
description = "MCP server for knowledge graph memory system via HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
memory-http-mcp = "memory_server:main"