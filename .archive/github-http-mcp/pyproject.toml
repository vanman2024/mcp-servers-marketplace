[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-http-mcp"
version = "0.1.0"
description = "MCP server for GitHub API via HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "PyGithub>=2.1.0",
]

[project.scripts]
github-http-mcp = "github_server:main"