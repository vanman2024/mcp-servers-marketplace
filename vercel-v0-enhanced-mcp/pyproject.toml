[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vercel-v0-enhanced-mcp"
version = "1.0.0"
description = "Enhanced MCP server for Vercel v0 UI component generation with Platform API integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
vercel-v0-enhanced-mcp = "vercel_v0_server:main"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
EOF < /dev/null
