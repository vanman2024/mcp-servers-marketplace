version: '3.8'

services:
  figma-mcp-marketing:
    build:
      context: ./figma-mcp-marketing
      dockerfile: Dockerfile
    container_name: figma-mcp-marketing
    ports:
      - "8040:8040"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FIGMA_MCP_PORT=8040
      - ENVIRONMENT=production
    volumes:
      - ./figma-mcp-marketing/logs:/app/logs
      - ./figma-mcp-marketing/data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - figma-mcp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketing.rule=PathPrefix(`/mcp/marketing`)"
      - "traefik.http.routers.marketing.service=marketing"
      - "traefik.http.services.marketing.loadbalancer.server.port=8040"

  figma-mcp-ecommerce:
    build:
      context: ./figma-mcp-ecommerce
      dockerfile: Dockerfile
    container_name: figma-mcp-ecommerce
    ports:
      - "8041:8041"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FIGMA_MCP_PORT=8041
      - ENVIRONMENT=production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - ./figma-mcp-ecommerce/logs:/app/logs
      - ./figma-mcp-ecommerce/data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - figma-mcp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecommerce.rule=PathPrefix(`/mcp/ecommerce`)"
      - "traefik.http.routers.ecommerce.service=ecommerce"
      - "traefik.http.services.ecommerce.loadbalancer.server.port=8041"

  figma-mcp-application:
    build:
      context: ./figma-mcp-application
      dockerfile: Dockerfile
    container_name: figma-mcp-application
    ports:
      - "8042:8042"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - FIGMA_MCP_PORT=8042
      - ENVIRONMENT=production
    volumes:
      - ./figma-mcp-application/logs:/app/logs
      - ./figma-mcp-application/data:/app/data
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - figma-mcp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.application.rule=PathPrefix(`/mcp/application`)"
      - "traefik.http.routers.application.service=application"
      - "traefik.http.services.application.loadbalancer.server.port=8042"

  redis:
    image: redis:7-alpine
    container_name: figma-mcp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - figma-mcp-network

  traefik:
    image: traefik:v3.0
    container_name: figma-mcp-traefik
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@synapseai.dev"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - figma-mcp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  prometheus:
    image: prom/prometheus:latest
    container_name: figma-mcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - figma-mcp-network

  grafana:
    image: grafana/grafana:latest
    container_name: figma-mcp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - figma-mcp-network

networks:
  figma-mcp-network:
    driver: bridge

volumes:
  redis-data:
  traefik-letsencrypt:
  prometheus-data:
  grafana-data: